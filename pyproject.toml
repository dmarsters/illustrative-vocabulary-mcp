[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illustrative-vocabulary-mcp"
version = "0.1.0"
description = "MCP server providing deterministic visual vocabulary for illustrative artwork, preventing style drift"
authors = [
    {name = "Dal", email = "dal@lushy.ai"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "mypy>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["illustrative_vocabulary_mcp"]

[tool.setuptools.package-data]
illustrative_vocabulary_mcp = ["ologs/*.yaml", "ologs/*.yml"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
